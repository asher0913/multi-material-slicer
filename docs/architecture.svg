<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Multi-Material Resin Slicer architecture</title>
  <desc id="desc">STL and STEP files flow through import, an assembly-aware scene, slicing, and merge scheduling to produce PNG masks and G-code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243b61"/>
      <stop offset="1" stop-color="#1b2c49"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#68d7ff"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="60" y="72" fill="#f3f8ff" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">Multi-Material Resin Slicer</text>
  <text x="60" y="105" fill="#9eb5d3" font-family="Inter,Arial,sans-serif" font-size="17">Assembly-aware desktop workflow from CAD input to synchronized exposure masks and machine commands</text>

  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="60" y="175" width="190" height="155" rx="18" fill="url(#card)" stroke="#4771a8"/>
    <text x="155" y="215" text-anchor="middle" fill="#68d7ff" font-size="16" font-weight="700">INPUT</text>
    <text x="155" y="258" text-anchor="middle" fill="#fff" font-size="24" font-weight="700">STL / STEP</text>
    <text x="155" y="290" text-anchor="middle" fill="#b9cae1" font-size="15">validated geometry</text>

    <rect x="315" y="145" width="230" height="215" rx="18" fill="url(#card)" stroke="#4771a8"/>
    <text x="430" y="185" text-anchor="middle" fill="#68d7ff" font-size="16" font-weight="700">SCENE MODEL</text>
    <text x="430" y="226" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Assembly hierarchy</text>
    <text x="430" y="262" text-anchor="middle" fill="#b9cae1" font-size="15">transforms · materials</text>
    <text x="430" y="290" text-anchor="middle" fill="#b9cae1" font-size="15">OpenGL VBO preview</text>
    <text x="430" y="318" text-anchor="middle" fill="#b9cae1" font-size="15">Qt desktop controls</text>

    <rect x="610" y="175" width="220" height="155" rx="18" fill="url(#card)" stroke="#4771a8"/>
    <text x="720" y="215" text-anchor="middle" fill="#68d7ff" font-size="16" font-weight="700">SLICER</text>
    <text x="720" y="257" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Layer rasterizer</text>
    <text x="720" y="290" text-anchor="middle" fill="#b9cae1" font-size="15">one mask stream per material</text>

    <rect x="895" y="145" width="245" height="215" rx="18" fill="url(#card)" stroke="#4771a8"/>
    <text x="1018" y="185" text-anchor="middle" fill="#68d7ff" font-size="16" font-weight="700">OUTPUT PLANNER</text>
    <text x="1018" y="226" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">Transition scheduler</text>
    <text x="1018" y="262" text-anchor="middle" fill="#b9cae1" font-size="15">merged exposure PNGs</text>
    <text x="1018" y="290" text-anchor="middle" fill="#b9cae1" font-size="15">run.gcode</text>
    <text x="1018" y="318" text-anchor="middle" fill="#b9cae1" font-size="15">estimated runtime</text>
  </g>

  <g fill="none" stroke="#68d7ff" stroke-width="4" marker-end="url(#arrow)">
    <path d="M250 252 H300"/>
    <path d="M545 252 H595"/>
    <path d="M830 252 H880"/>
  </g>

  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#8ea9ca">
    <text x="275" y="235" text-anchor="middle">parse</text>
    <text x="570" y="235" text-anchor="middle">export</text>
    <text x="855" y="235" text-anchor="middle">merge</text>
  </g>
  <rect x="60" y="405" width="1080" height="2" fill="#2b456b"/>
  <text x="60" y="445" fill="#9eb5d3" font-family="Inter,Arial,sans-serif" font-size="15">C++17 · Qt Widgets · OpenGL · Python · OpenCV · OpenCascade</text>
  <text x="1140" y="445" text-anchor="end" fill="#68d7ff" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700">CI-VERIFIED SELF-TEST</text>
</svg>
