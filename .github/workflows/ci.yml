name: CI

on:
  push:
  pull_request:

jobs:
  python-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q slice_1080p.py tools tests
      - run: ruff check slice_1080p.py tools tests
      - run: python -m unittest discover -s tests -v

  qt-application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libgl1-mesa-dev libqt5opengl5-dev qtbase5-dev \
            qttools5-dev-tools xvfb libxml2-utils
          python -m pip install -r requirements.txt
      - name: Validate Qt Designer file
        run: xmllint --noout ui/MainWindow.ui
      - name: Build application
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
      - name: Run application self-test
        env:
          QT_X11_NO_MITSHM: "1"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
            ./build/MultiMaterialSlicer --selftest \
            demo_stl/multi_A_base_plate.stl \
            demo_stl/multi_B_cross_insert.stl
